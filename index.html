<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chim Ngu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;touch-action:none;background:#000}
canvas{display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:env(safe-area-inset-top,14px) 18px 8px;pointer-events:none;z-index:5}
.pill{background:rgba(0,0,0,0.35);border-radius:20px;padding:5px 14px;color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(4px)}
#sc{position:absolute;top:0;left:50%;transform:translateX(-50%);padding-top:calc(env(safe-area-inset-top,0px) + 10px);color:#fff;font-size:52px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,0.6);display:none;pointer-events:none;z-index:5}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.card{background:rgba(10,10,20,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:28px 32px;text-align:center;color:#fff;width:min(320px,88vw);border:1px solid rgba(255,255,255,0.12)}
.card h1{font-size:26px;font-weight:800;margin-bottom:4px}
.card p{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px}
.srow{display:flex;justify-content:space-around;background:rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin:12px 0}
.sv{font-size:26px;font-weight:800;color:#ffe566}
.sl{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font:800 16px -apple-system,sans-serif;cursor:pointer;margin-top:6px;transition:transform 0.1s,opacity 0.1s}
.btn:active{transform:scale(0.97);opacity:0.9}
.btn-play{background:linear-gradient(135deg,#ffe566,#ffaa00);color:#1a1a00;box-shadow:0 4px 20px rgba(255,200,0,0.4)}
.btn-no-ads{background:rgba(255,229,102,0.15);color:#ffe566;border:1px solid rgba(255,229,102,0.3);font-size:13px;padding:11px}
.medal{font-size:24px;letter-spacing:4px;margin-bottom:6px}
.nr{color:#ffe566;font-size:13px;margin-top:8px;display:none}
.bird-logo{font-size:52px;margin-bottom:6px;display:block;animation:fl 2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#adLoading{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:16px}
#adLoading p{color:#fff;font-size:14px;opacity:0.7}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.2);border-top-color:#ffe566;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SPLASH SCREEN ── */
#splash{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(ellipse at center, #0a1628 0%, #000510 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  transition:opacity 0.8s ease;
}
#splash.hide{opacity:0;pointer-events:none}
#splashLogo{
  width:min(320px,78vw);height:min(420px,78vw);
  object-fit:contain;
  animation:splashPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
  filter:drop-shadow(0 0 40px rgba(0,200,255,0.6));
}
@keyframes splashPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
#splashTitle{
  color:#00e5ff;font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  margin-top:16px;opacity:0;animation:fadeIn 0.5s 0.5s forwards;
  text-shadow:0 0 20px rgba(0,229,255,0.8);
}
#splashBar{
  width:min(200px,55vw);height:3px;background:rgba(255,255,255,0.1);
  border-radius:2px;margin-top:28px;overflow:hidden;
  opacity:0;animation:fadeIn 0.5s 0.6s forwards;
}
#splashProgress{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#ffe566);border-radius:2px;transition:width 0.05s linear}
#splashSub{
  color:rgba(255,255,255,0.4);font-size:12px;margin-top:10px;
  opacity:0;animation:fadeIn 0.5s 0.8s forwards;
}
@keyframes fadeIn{to{opacity:1}}

/* ── LOGO nhỏ trong game ── */
#gameLogo{
  position:absolute;bottom:65px;right:12px;
  width:48px;height:48px;object-fit:contain;
  opacity:0.22;pointer-events:none;z-index:4;
  display:none;
}

/* ── Logo trên start card ── */
#startLogoImg{
  width:90px;height:90px;object-fit:contain;
  margin:0 auto 10px;display:block;
  filter:drop-shadow(0 0 16px rgba(0,200,255,0.5));
  animation:fl 2.5s ease-in-out infinite;
}

/* ── Nền canvas blur khi idle ── */
#bgCanvas{
  position:absolute;inset:0;z-index:1;
  display:block;opacity:0;transition:opacity 1s;
}
#bgCanvas.show{opacity:1}
</style>
</head>
<body>

<div id="hud">
  <div class="pill">🏆 <span id="hi">0</span></div>
  <div class="pill" id="rk">Tập sự</div>
</div>
<div id="sc">0</div>
<canvas id="c"></canvas>

<!-- Logo mờ nhỏ trong góc khi chơi -->
<img id="gameLogo" src="" alt="">

<!-- Ad loading screen -->
<div id="adLoading">
  <div class="spinner"></div>
  <p>Đang tải quảng cáo...</p>
</div>

<!-- SPLASH SCREEN -->
<div id="splash">
  <img id="splashLogo" src="" alt="2026 Logo">
  <div id="splashTitle">Chim Ngu Game</div>
  <div id="splashBar"><div id="splashProgress"></div></div>
  <div id="splashSub">Đang khởi động...</div>
</div>

<div id="ov" style="display:none">
  <!-- Start screen -->
  <div class="card" id="s0">
    <img id="startLogoImg" src="" alt="Logo">
    <h1 id="themeTitle">Chim Ngu</h1>
    <p id="themeSub">Mỗi ván một thế giới mới!</p>
    <div class="srow">
      <div><div class="sv" id="sh">0</div><div class="sl">Cao nhất</div></div>
      <div><div class="sv" id="st">0</div><div class="sl">Lần chơi</div></div>
    </div>
    <button class="btn btn-play" id="s0b">▶ Bắt đầu bay!</button>
  </div>

  <!-- Dead screen -->
  <div class="card" id="s1" style="display:none">
    <div class="medal" id="md"></div>
    <h1>💀 Chim chết rồi!</h1>
    <p id="qp"></p>
    <div class="srow">
      <div><div class="sv" id="ds">0</div><div class="sl">Điểm vừa</div></div>
      <div><div class="sv" id="dh">0</div><div class="sl">Kỷ lục</div></div>
    </div>
    <button class="btn btn-play" id="s1b">🔄 Chơi lại!</button>
    <div class="nr" id="nr">🎉 Kỷ lục mới!</div>
  </div>
</div>

const logoImg = new Image();
logoImg.src = LOGO_B64;
logoImg.onload = () => {
  document.getElementById('splashLogo').src  = LOGO_B64;
  document.getElementById('startLogoImg').src= LOGO_B64;
  document.getElementById('gameLogo').src    = LOGO_B64;
};

// Splash progress bar animation
let splashDone = false;
const splashEl  = document.getElementById('splash');
const progEl    = document.getElementById('splashProgress');
const splashSub = document.getElementById('splashSub');
let prog = 0;
const splashInterval = setInterval(()=>{
  prog = Math.min(prog + (Math.random()*4+2), 100);
  progEl.style.width = prog + '%';
  if(prog >= 40)  splashSub.textContent = 'Đang tải thế giới...';
  if(prog >= 75)  splashSub.textContent = 'Thả chim vào game...';
  if(prog >= 100 && !splashDone){
    splashDone = true;
    clearInterval(splashInterval);
    splashSub.textContent = 'Sẵn sàng! 🐦';
    setTimeout(()=>{
      splashEl.classList.add('hide');
      setTimeout(()=>{ splashEl.style.display='none'; showStart(); }, 800);
    }, 500);
  }
}, 50);
const AdMob = {
  isNative: !!(window.webkit?.messageHandlers?.admob),

  init(){
    // Preload interstitial ngay từ đầu
    this._send({action:'preload'});
    // Nhận callback từ Swift
    window.onAdClosed      = ()=>this._onClosed();
    window.onAdFailedToLoad= ()=>this._onFailed();
    //window.onPurchaseOK    = ()=>this._onPurchaseOK();
  },

  // Hiện interstitial sau khi chim chết
  showInterstitial(callback){
    this._callback = callback;
    if(!this.isNative){
      // Không có ad → thẳng vào callback
      setTimeout(callback, 0);
      return;
    }
    // Hiện loading spinner ngắn
    document.getElementById('adLoading').style.display='flex';
    this._send({action:'showInterstitial'});
    // Timeout 8s phòng ad không load được
    this._timeout = setTimeout(()=>this._onFailed(), 8000);
  },

  _onClosed(){
    clearTimeout(this._timeout);
    document.getElementById('adLoading').style.display='none';
    this._send({action:'preload'}); // preload cho ván tiếp
    if(this._callback){ this._callback(); this._callback=null; }
  },

  _onFailed(){
    clearTimeout(this._timeout);
    document.getElementById('adLoading').style.display='none';
    if(this._callback){ this._callback(); this._callback=null; }
  },

  _send(msg){
    try{ window.webkit?.messageHandlers?.admob?.postMessage(msg); }catch(e){}
  }
};

// ── 1. CÂY TRE ──────────────────────────────────────────
const LC=['#2e6e0c','#3a8a10','#48a214','#306010','#427810'];
const SEG=54;
function drawLeaf(ox,oy,a,l,w,c){
  ctx.save();ctx.translate(ox,oy);ctx.rotate(a);
  ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(w*0.9,-l*0.25,w*0.7,-l*0.70,0,-l);
  ctx.bezierCurveTo(-w*0.4,-l*0.70,-w*0.3,-l*0.25,0,0);
  ctx.fill();
  ctx.strokeStyle='rgba(10,40,5,0.4)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(w*0.1,-l*0.5,0,-l);ctx.stroke();
  ctx.restore();
}
function drawNode(cx,jy,flip){
  const f=flip?-1:1;
  ctx.fillStyle='#163808';ctx.fillRect(cx-PW/2-4,jy-4,PW+8,8);
  ctx.fillStyle='#5aac1c';ctx.fillRect(cx-PW/2-3,jy-4,PW+6,3);
  ctx.fillStyle='#80d030';ctx.fillRect(cx-PW/2,jy-5,PW,2);
  ctx.fillStyle='#245a08';
  ctx.beginPath();ctx.moveTo(cx-PW/2-3,jy-1);ctx.lineTo(cx-PW/2-13,jy-5);ctx.lineTo(cx-PW/2-13,jy+2);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+PW/2+3,jy-1);ctx.lineTo(cx+PW/2+13,jy-5);ctx.lineTo(cx+PW/2+13,jy+2);ctx.closePath();ctx.fill();
  [[-0.5*f,52,9,LC[0]],[-0.85*f,44,8,LC[2]],[-1.2*f,38,7,LC[4]]].forEach(([a,l,w,c])=>drawLeaf(cx-PW/2,jy,a,l,w,c));
  [[0.55*f,54,9,LC[1]],[0.90*f,46,8,LC[3]],[1.25*f,40,7,LC[0]]].forEach(([a,l,w,c])=>drawLeaf(cx+PW/2,jy,a,l,w,c));
}
function drawStem(px,y0,y1,tilt,flip){
  const h=y1-y0;if(h<=0)return;
  const n=Math.ceil(h/SEG);
  for(let i=0;i<n;i++){
    const sy=y0+i*SEG,ey=Math.min(sy+SEG,y1),sh=ey-sy,sx=px+tilt*i;
    ctx.fillStyle='#4a8c1a';ctx.fillRect(sx,sy,PW,sh);
    ctx.fillStyle='#68b828';ctx.fillRect(sx+4,sy,6,sh);
    ctx.fillStyle='#326010';ctx.fillRect(sx+PW-8,sy,8,sh);
  }
  ctx.strokeStyle='#1e4808';ctx.lineWidth=1.5;ctx.strokeRect(px,y0,PW,h);
  for(let i=1;i<n;i++){const jy=y0+i*SEG;if(jy>=y1)break;drawNode(px+tilt*i+PW/2,jy,flip);}
}
function drawBamboo(p){
  drawStem(p.x,0,p.top,p.tilt||0,false);
  drawStem(p.x,p.top+GAP,H,p.tilt||0,true);
}

// ── 2. TOÀ NHÀ NEON ─────────────────────────────────────
function drawBuilding(p){
  const bw=PW+8,nc=['#ff00ff','#00ffff','#ff8800','#8800ff','#00ff88'];
  ctx.fillStyle='#0d001f';ctx.fillRect(p.x-4,0,bw,p.top);
  for(let y=8;y<p.top-12;y+=18)
    for(let wx=p.x;wx<p.x+PW-6;wx+=14){
      ctx.fillStyle=nc[((y+wx)/5|0)%nc.length];
      ctx.globalAlpha=0.6+Math.sin(frame*0.08+(y+wx)*0.3)*0.35;
      ctx.fillRect(wx,y,8,10);
    }
  ctx.globalAlpha=1;
  ctx.strokeStyle='#ff00ff';ctx.lineWidth=2;
  ctx.shadowColor='#ff00ff';ctx.shadowBlur=10;
  ctx.strokeRect(p.x-4,0,bw,p.top);ctx.shadowBlur=0;
  const by=p.top+GAP;
  ctx.fillStyle='#0d001f';ctx.fillRect(p.x-4,by,bw,H-by);
  for(let y=by+8;y<H-12;y+=18)
    for(let wx=p.x;wx<p.x+PW-6;wx+=14){
      ctx.fillStyle=nc[((y+wx+7)/5|0)%nc.length];
      ctx.globalAlpha=0.6+Math.sin(frame*0.08+(y+wx)*0.3+2)*0.35;
      ctx.fillRect(wx,y,8,10);
    }
  ctx.globalAlpha=1;
  ctx.strokeStyle='#00ffff';ctx.lineWidth=2;
  ctx.shadowColor='#00ffff';ctx.shadowBlur=10;
  ctx.strokeRect(p.x-4,by,bw,H-by);ctx.shadowBlur=0;
}

// ── 3. CỘT MÂY ──────────────────────────────────────────
function drawCloudPillar(p){
  const puff=(x,y,r,a)=>{ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()};
  const mid=p.x+PW/2,rr=PW/2+6;
  for(let y=0;y<p.top;y+=20){puff(mid,y,rr,0.88);puff(mid-10,y+6,rr*0.7,0.6);puff(mid+10,y+6,rr*0.7,0.6);}
  for(let i=0;i<6;i++) puff(p.x+PW/2+(i-2.5)*11,p.top-6,15,0.92);
  const by=p.top+GAP;
  for(let y=by;y<H;y+=20){puff(mid,y,rr,0.88);puff(mid-10,y-6,rr*0.7,0.6);puff(mid+10,y-6,rr*0.7,0.6);}
  for(let i=0;i<6;i++) puff(p.x+PW/2+(i-2.5)*11,by+6,15,0.92);
  ctx.globalAlpha=1;
}

// ── 4. NÚI LỬA ──────────────────────────────────────────
function drawLava(p){
  ctx.fillStyle='#3d0800';ctx.fillRect(p.x,0,PW,p.top);
  ctx.strokeStyle='#ff4400';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(p.x+PW/2,0);
  for(let y=0;y<p.top;y+=16) ctx.lineTo(p.x+PW/2+Math.sin(y*0.28+frame*0.06)*5,y);
  ctx.stroke();
  for(let i=0;i<5;i++){
    const lx=p.x+8+i*9,ly=p.top-Math.abs(Math.sin(frame*0.04+i))*28;
    const lg=ctx.createLinearGradient(lx,ly,lx,p.top+8);
    lg.addColorStop(0,'#ff6600');lg.addColorStop(1,'rgba(180,20,0,0)');
    ctx.fillStyle=lg;ctx.fillRect(lx,ly,7,p.top-ly+8);
  }
  ctx.strokeStyle='#8b2000';ctx.lineWidth=2;ctx.strokeRect(p.x,0,PW,p.top);
  const by=p.top+GAP;
  ctx.fillStyle='#3d0800';ctx.fillRect(p.x,by,PW,H-by);
  ctx.strokeStyle='#ff4400';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(p.x+PW/2,by);
  for(let y=by;y<H;y+=16) ctx.lineTo(p.x+PW/2+Math.sin(y*0.28+frame*0.06)*5,y);
  ctx.stroke();
  for(let i=0;i<5;i++){
    const lx=p.x+8+i*9,ly=by+Math.abs(Math.sin(frame*0.04+i+3))*28;
    const lg=ctx.createLinearGradient(lx,by,lx,ly+8);
    lg.addColorStop(0,'rgba(180,20,0,0)');lg.addColorStop(1,'#ff6600');
    ctx.fillStyle=lg;ctx.fillRect(lx,by-4,7,ly-by+12);
  }
  ctx.strokeStyle='#8b2000';ctx.lineWidth=2;ctx.strokeRect(p.x,by,PW,H-by);
}

//  BIRD
// ══════════════════════════════════════════════════════════
function drawBird(){
  const {x,y,vy,dead}=bird;
  const ang=Math.min(Math.PI/3,Math.max(-Math.PI/4,vy*0.06));
  bird.wingPhase+=0.3;
  const wA=Math.sin(bird.wingPhase)*0.7;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.fillStyle='#FFD700';ctx.save();ctx.rotate(-0.3+wA);
  ctx.beginPath();ctx.ellipse(-6,0,19,8,0.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFC200';ctx.beginPath();ctx.ellipse(-6,0,11,5,0.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.ellipse(0,0,21,17,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFC200';ctx.beginPath();ctx.ellipse(2,3,14,12,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-5,7,0,Math.PI*2);ctx.fill();
  bird.blink++;
  if(dead){
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(10,-5,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(7,-7,5,2);ctx.fillRect(7,-4,5,2);
  }else if(bird.blink%90<7){
    ctx.fillStyle='#FFD700';ctx.fillRect(5,-7,8,3);
  }else{
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(10,-5,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(11.5,-6.5,1.8,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#FF7700';
  ctx.beginPath();ctx.moveTo(18,-1);ctx.lineTo(28,2);ctx.lineTo(18,5);ctx.closePath();ctx.fill();
  ctx.restore();
}

function spawnP(x,y,col,n){for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,col});}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

let ac;
const gAC=()=>{
  if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)();
  // iOS WKWebView: AudioContext thường khởi tạo ở trạng thái "suspended"
  // phải resume() ngay trong cùng 1 user-gesture (lần chạm) mới phát được âm thanh
  if(ac.state === 'suspended'){ ac.resume(); }
  return ac;
};
const beep=(f1,f2,t,vol,type='sine')=>{try{const a=gAC(),o=a.createOscillator(),g=a.createGain();o.type=type;o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(f1,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t);o.start();o.stop(a.currentTime+t)}catch(e){}};
// ── PHÁT ÂM THANH: ưu tiên native bridge (Swift AVAudioEngine) ──
// trên iOS app, fallback Web Audio API khi chạy trên browser thường.
const hasNativeSound = !!(window.webkit?.messageHandlers?.nativeSound);
function playSound(kind, f1, f2, t, vol, type){
  if(hasNativeSound){
    try{ window.webkit.messageHandlers.nativeSound.postMessage({kind}); return; }catch(e){}
  }
  beep(f1, f2, t, vol, type);
}
const pFlap=()=>playSound('flap', 550,280,0.12,0.25);
const pScore=()=>playSound('score', 880,1100,0.18,0.35,'triangle');
const pDie=()=>playSound('die', 380,70,0.45,0.5);

// ══════════════════════════════════════════════════════════
//  COLLISION
// ══════════════════════════════════════════════════════════
function checkHit(p){
  const bx=bird.x,by=bird.y,br=12;
  return[[p.x-4,0,PW+8,p.top],[p.x-4,p.top+GAP,PW+8,H]].some(([rx,ry,rw,rh])=>{
    const cx=Math.max(rx,Math.min(bx,rx+rw)),cy=Math.max(ry,Math.min(by,ry+rh));
    return(bx-cx)**2+(by-cy)**2<br*br;
  });
}
const getSpd=()=>2.5+score*0.04;

// ══════════════════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════════════════
function pickTheme(){
  themeIdx=Math.floor(Math.random()*THEMES.length);
  theme=THEMES[themeIdx];
  const el=document.getElementById('themeTitle');
  const el2=document.getElementById('themeSub');
  if(el) el.textContent=theme.name;
  if(el2) el2.textContent=theme.sub;
}

function initGame(){
  pickTheme();
  bird={x:W*0.22,y:H*0.44,vy:0,wingPhase:0,blink:0,dead:false};
  pipes=[{x:W*0.75,top:H*0.2+Math.random()*(H-H*0.4-GAP),passed:false,tilt:(Math.random()-0.5)*3}];
  parts=[];score=0;frame=0;cOff=0;died=false;state='play';
  const sc=document.getElementById('sc');
  sc.style.display='block';sc.style.color=theme.scCol;sc.textContent='0';
  document.getElementById('ov').style.display='none';
  // Hiện logo watermark nhỏ khi đang chơi
  const gl=document.getElementById('gameLogo');
  gl.style.display='block';
}

function showStart(){
  state='idle';
  document.getElementById('sc').style.display='none';
  document.getElementById('ov').style.display='flex';
  document.getElementById('s0').style.display='block';
  document.getElementById('s1').style.display='none';
  document.getElementById('gameLogo').style.display='none';
  document.getElementById('sh').textContent=saves.hi;
  document.getElementById('st').textContent=saves.total;
  document.getElementById('hi').textContent=saves.hi;
  document.getElementById('rk').textContent=rk(saves.hi);
}

function showDead(){
  state='dead';saves.total++;
  const isNew=score>saves.hi;if(isNew)saves.hi=score;sv();
  document.getElementById('sc').style.display='none';
  document.getElementById('ov').style.display='flex';
  document.getElementById('s0').style.display='none';
  document.getElementById('s1').style.display='block';
  document.getElementById('ds').textContent=score;
  document.getElementById('dh').textContent=saves.hi;
  document.getElementById('qp').textContent=qp(score);
  document.getElementById('md').textContent=getMd(score);
  document.getElementById('hi').textContent=saves.hi;
  document.getElementById('rk').textContent=rk(saves.hi);
  document.getElementById('nr').style.display=isNew&&score>0?'block':'none';
}

// ── CHẾ ĐỘ CHẾT → GỌI QUẢNG CÁO → VÀO MÀN CHẾT ──────────
function die(){
  if(died)return;died=true;bird.dead=true;bird.vy=FLAP*0.5;
  spawnP(bird.x,bird.y,'#ff4444',20);pDie();
  // Chờ animation chết xong rồi hiện ad
  setTimeout(()=>{
    AdMob.showInterstitial(()=>showDead());
  }, 900);
}

function flap(){
  if(state!=='play')return;
  bird.vy=FLAP;bird.wingPhase=0;
  spawnP(bird.x,bird.y,theme.scCol,5);pFlap();
}

// ══════════════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════════════
function loop(){
  theme.sky();
  if(theme.stars)drawStarsBg();
  if(theme.moon)drawMoon();
  if(themeIdx===2)drawClouds();

  // ── Logo trên canvas khi idle (to, trung tâm, mờ đẹp) ──
  if(state==='idle' && logoImg.complete){
    const lSize = Math.min(W,H)*0.52;
    ctx.save();
    ctx.globalAlpha = 0.18 + Math.sin(frame*0.03)*0.06;
    // Vòng sáng phía sau logo
    const grd=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,lSize*0.7);
    grd.addColorStop(0,'rgba(0,200,255,0.25)');
    grd.addColorStop(1,'rgba(0,200,255,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(W/2,H/2,lSize*0.7,0,Math.PI*2);ctx.fill();
    // Logo
    ctx.globalAlpha = 0.22 + Math.sin(frame*0.03)*0.08;
    ctx.drawImage(logoImg, W/2-lSize/2, H/2-lSize/2, lSize, lSize);
    ctx.restore();
  }

  // ── Logo nhỏ watermark góc phải dưới khi đang chơi ──
  if(state==='play' && logoImg.complete){
    const s=52;
    ctx.save();
    ctx.globalAlpha=0.18;
    ctx.drawImage(logoImg, W-s-10, H-s-60, s, s);
    ctx.restore();
  }

  if(state==='play'){
    frame++;const spd=getSpd();
    bird.vy+=GRAVITY;bird.y+=bird.vy;
    if(!bird.dead){
      // Spawn pipe khi cột cuối cùng đã vào đủ PIPE_SPACING pixel
      const lastX = pipes.length ? pipes[pipes.length-1].x : -Infinity;
      if(lastX <= W - PIPE_SPACING){
        pipes.push({x:W+PW,top:H*0.14+Math.random()*(H-H*0.28-GAP),passed:false,tilt:(Math.random()-0.5)*3});
      }
      pipes.forEach(p=>{
        p.x-=spd;
        if(!p.passed&&p.x+PW<bird.x){
          p.passed=true;score++;
          document.getElementById('sc').textContent=score;
          spawnP(bird.x,bird.y,theme.scCol,score%5===0?14:7);
          pScore();
        }
        if(checkHit(p))die();
      });
      pipes=pipes.filter(p=>p.x>-PW-80);
      if(bird.y>H-52-12){bird.y=H-52-12;die();}
      if(bird.y<12){bird.y=12;bird.vy=2;}
    }else{if(bird.y>H-52-12)bird.y=H-52-12;}
  }else if(state==='idle'){
    bird.y=H*0.44+Math.sin(frame*0.04)*18;bird.vy=Math.cos(frame*0.04)*2;frame++;
  }

  pipes.forEach(p=>theme.drawPipe(p));
  drawGround();
  parts=parts.filter(p=>p.life>0.04);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life*=0.88;});
  drawParts();drawBird();
  requestAnimationFrame(loop);
}
